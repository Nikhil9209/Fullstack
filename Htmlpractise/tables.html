<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>My first table</h2>
    <table border="2px solid black">
        <tr>
            <td>Student Name</td>
            <td>Roll no</td>
            <td>Address</td>
        </tr>
        <tr>
            <td>Nikhil</td>
            <td>09</td>
            <td>Jaipur</td>
        </tr>
        <tr>
            <td>Mansha</td>
            <td>06</td>
            <td>Jaipur</td>
        </tr>
    </table>

    <br><br><br>
    <!-- Using Thead and Tbody--> 
    
    <table border="2px solid black">
        <caption  >Birth Timing</caption>
        <thead>
            <th>Year</th>
            <th>Month</th>
            <th> Day</th>
        </thead>
        <tbody>
            <tr>

                <td>2006</td>
                <td>April</td>
                <td>8:00am</td>
            </tr>
            <tr>
                <td>2006</td>
                <td>August</td>
                <td>2:00pm</td>
            </tr>
        </tbody>

    </table>
    <br><br><br>
    <!--Colspan and Rowsapn-->
    <table border="2px solid black">
        <caption  >List</caption>
        <thead>
            <th colspan="3">TO DO LIST</th>
        </thead>
        <tbody>
            <tr>

                <td rowspan="2">Eat</td>
                <td rowspan="2">Study</td>
                <td>Sleep</td>
            </tr>
            <tr>
                <td>Sleep</td>
            </tr>
    </tbody>

    </table>
</body>
</html>
